[build]
command = "npm run build"
publish = "build"

# Note: Le site est maintenant entièrement statique (headless)
# Aucune fonction serveur n'est nécessaire

# Configuration pour ignorer le scan de secrets pour AIRTABLE_BASE_ID (ID public, pas un secret)
[build.environment]
SECRETS_SCAN_OMIT_KEYS = "AIRTABLE_BASE_ID"

# Headers de sécurité pour toutes les pages
[[headers]]
for = "/*"
  [headers.values]
  Referrer-Policy = "strict-origin-when-cross-origin"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"
  X-XSS-Protection = "1; mode=block"

# Cache optimisé pour les images
[[headers]]
for = "/images/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Cache optimisé pour les vidéos
[[headers]]
for = "/videos/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Cache pour les assets statiques
[[headers]]
for = "/*.js"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.css"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Cache pour les fonts
[[headers]]
for = "/*.woff2"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.woff"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"
